<svg width="320" height="120" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 노란색 그라디언트 -->
    <linearGradient id="yellowFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFC000"/>
    </linearGradient>
    <!-- 파란색 그라디언트 -->
    <linearGradient id="blueFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF"/>
      <stop offset="100%" style="stop-color:#0080FF"/>
    </linearGradient>
    <!-- 그림자 효과 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 배경 폭발 효과 (상단 중앙) -->
  <g transform="translate(160,25)">
    <polygon points="0,-8 4,-3 10,-3 5,1 7,8 0,4 -7,8 -5,1 -10,-3 -4,-3" 
             fill="#333" stroke="#000" stroke-width="1.5"/>
  </g>
  
  <!-- 급식 (노란색 부분) -->
  <g transform="translate(20,35)" filter="url(#shadow)">
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
          fill="url(#yellowFill)" stroke="#000" stroke-width="2">급식</text>
  </g>
  
  <!-- 배틀 (파란색 부분) -->
  <g transform="translate(140,35)" filter="url(#shadow)">
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" 
          fill="url(#blueFill)" stroke="#000" stroke-width="2">배틀</text>
  </g>
  
  <!-- 하단 텍스트: 급식도 민주주의! -->
  <text x="160" y="95" text-anchor="middle" font-family="Arial Black, sans-serif" 
        font-size="16" font-weight="bold" fill="#000">급식도 민주주의!</text>
</svg>

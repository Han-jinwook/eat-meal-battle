[build]
  base = "."
  command = "npm ci --legacy-peer-deps --no-audit --no-fund && npm run build"
  publish = ".next"
  functions = "netlify/functions"
  # 변경사항 없으면 빌드 스킵 (임시 비활성화)
  # ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF"

[functions]
  node_bundler = "esbuild"
  # 번들 크기 최적화를 위한 외부 모듈 확장
  external_node_modules = ["@supabase/supabase-js", "jsonwebtoken", "sharp", "firebase-admin", "axios", "openai", "date-fns", "uuid", "canvas", "jimp", "node-fetch", "form-data", "mime-types", "lodash", "crypto-js", "buffer", "stream", "util", "path", "fs", "zlib", "querystring", "url", "http", "https", "events", "os", "child_process", "cluster", "net", "tls", "dgram", "dns", "readline", "repl", "vm", "assert", "constants", "punycode", "string_decoder", "timers", "tty", "v8", "worker_threads"]

[functions.generate-meal-image]
  timeout = 30

# 디버그를 위한 개별 함수 설정 (크기 모니터링)
[functions.quiz]
  # 가장 큰 함수 - 실패 가능성 높음
  timeout = 30
  
[functions.meals]
  # 두 번째로 큰 함수 - 실패 가능성 높음
  timeout = 30
  
[functions.manual-generate-meal-quiz]
  # 세 번째로 큰 함수 - 실패 가능성 높음
  timeout = 30

[functions.verify-meal-image]
  timeout = 60

# 실제 파일명과 일치하는 함수 설정
[functions.initialize-school-champion-criteria]
  timeout = 120

[functions.schedule-champion-criteria]
  timeout = 120

[functions.staff-login]
  timeout = 30

[build.environment]
  # 빌드 속도 최적화 환경변수 (기능 변경 없음)
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_OPTIONS = "--max-old-space-size=4096"
  # 장원 시스템 환경 변수
  CHAMPION_TEST_MODE = "true"
  USE_NEW_CHAMPION_SYSTEM = "false"
  # 디버그 환경변수
  DEBUG = "netlify*"
  NETLIFY_FUNCTIONS_DEBUG = "true"
  # Node.js 20 강제 설정
  NODE_VERSION = "20.x"
  NPM_FLAGS = "--no-audit --no-fund --include=optional"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://*.firebase.com wss://*.firebaseio.com https://firestore.googleapis.com https://os.sundreamer.app https://images.unsplash.com; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com https://lh3.googleusercontent.com https://k.kakaocdn.net https://i.imgur.com;"

# 존재하지 않는 함수 설정 제거 완료

# API 경로를 Netlify Functions로 리다이렉트
[[redirects]]
  from = "/api/meals"
  to = "/.netlify/functions/meals"
  status = 200
  force = true

[[redirects]]
  from = "/api/quiz"
  to = "/.netlify/functions/quiz"
  status = 200
  force = true

[[redirects]]
  from = "/api/quiz/*"
  to = "/.netlify/functions/quiz/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/user/*"
  to = "/.netlify/functions/user/:splat"
  status = 200
  force = true

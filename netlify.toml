[build]
  base = "apps/app"
  command = "npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund && npm run build"
  publish = ".next"
  functions = "netlify/functions"
  # 변경사항 없으면 빌드 스킵
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF"

[functions]
  node_bundler = "esbuild"
  # 번들 크기 최적화를 위한 외부 모듈 확장
  external_node_modules = ["@supabase/supabase-js", "jsonwebtoken", "sharp", "firebase-admin", "axios", "openai", "date-fns", "uuid", "canvas", "jimp", "node-fetch", "form-data", "mime-types"]
  # 함수 소스만 포함, 아티팩트 제외
  included_files = ["*.js"]
  ignored_files = ["*.zip", "manifest.json", "*.map"]

[functions.generate-meal-image]
  timeout = 60

[functions.quiz]
  # 최적화된 번들링 설정 - 큰 함수 최적화
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js", "openai", "axios"]
  
[functions.menu-ratings]
  # 최적화된 번들링 설정
  
[functions.meals]
  # 최적화된 번들링 설정 - 큰 함수 최적화
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js", "axios", "date-fns"]

[functions.verify-meal-image]
  timeout = 60

[functions.initialize-champion-criteria]
  timeout = 120

[functions.monthly-champion-criteria]
  timeout = 120
  schedule = "0 1 1 * *"

[functions.update-champion-status-on-quiz-submit]
  timeout = 30

[functions.mark-missing-submissions-failed]
  timeout = 120

[build.environment]
  # 빌드 속도 최적화 환경변수 (기능 변경 없음)
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--prefer-offline --no-audit --no-fund"
  NODE_OPTIONS = "--max-old-space-size=4096"
  # 장원 시스템 환경 변수
  CHAMPION_TEST_MODE = "true"
  USE_NEW_CHAMPION_SYSTEM = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 추가 스케줄된 함수 설정
[functions.auto-generate-meal-images]
  timeout = 60

[functions.monthly-champion-criteria-last-day]
  schedule = "0 9 L * *"
  timeout = 60

# API 경로를 Netlify Functions로 리다이렉트
[[redirects]]
  from = "/api/meals"
  to = "/.netlify/functions/meals"
  status = 200
  force = true

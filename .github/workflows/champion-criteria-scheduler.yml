name: champion-criteria-scheduler

on:
  schedule:
    # 매월 28일 오전 6시 (한국 시간, UTC+9)
    # UTC 기준으로는 전날 오후 9시
    - cron: '0 21 28 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (6-9)'
        required: true
        default: '6'
        type: choice
        options:
          - '6'
          - '7'
          - '8'
          - '9'

jobs:
  # 먼저 처리할 학교 목록을 가져오는 job
  get-schools:
    runs-on: ubuntu-latest
    outputs:
      school_codes: ${{ steps.get-schools.outputs.school_codes }}
    steps:
      - name: Get School Codes from DB
        id: get-schools
        env:
          API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NETLIFY_URL: "${{ secrets.NETLIFY_URL || 'https://lunbat.com' }}"
        run: |
          # DB에서 실제 학교 목록 가져오기 (모든 학교 포함)
          response=$(curl -s "${NETLIFY_URL}/.netlify/functions/schedule-champion-criteria?api_key=${API_KEY}&get_schools=true")
          echo "API Response: $response"
          
          # 응답에서 학교 코드 배열 추출
          school_codes=$(echo "$response" | grep -o '"school_codes":\[[^]]*\]' | sed 's/"school_codes"://')
          
          if [ -z "$school_codes" ] || [ "$school_codes" = "[]" ]; then
            echo "No school codes found, using fallback"
            school_codes='["7361073"]'  # 최소 1개 학교 fallback
          fi
          
          echo "school_codes=${school_codes}" >> $GITHUB_OUTPUT
          echo "Found school codes: ${school_codes}"

  # 각 학교별로 병렬 처리
  process-schools:
    needs: get-schools
    runs-on: ubuntu-latest
    strategy:
      matrix:
        school_code: ${{ fromJson(needs.get-schools.outputs.school_codes) }}
      fail-fast: false  # 하나 실패해도 다른 학교는 계속 처리
      max-parallel: 5   # 최대 5개 학교 동시 처리
    
    steps:
      - name: Process School ${{ matrix.school_code }}
        env:
          API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NETLIFY_URL: "${{ secrets.NETLIFY_URL || 'https://lunbat.com' }}"
          MONTH: ${{ github.event.inputs.month || '6' }}
        run: |
          echo "Processing school ${{ matrix.school_code }} for month ${MONTH}"
          curl -v "${NETLIFY_URL}/.netlify/functions/schedule-champion-criteria?api_key=${API_KEY}&month=${MONTH}&school_code=${{ matrix.school_code }}" || true
          echo "School ${{ matrix.school_code }} processing completed"
          
      - name: Wait between schools
        run: sleep 10  # 학교간 10초 대기로 NEIS API 부하 분산

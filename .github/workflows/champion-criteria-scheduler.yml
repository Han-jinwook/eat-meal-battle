name: champion-criteria-scheduler

on:
  schedule:
    # 매월 15일 오전 6시 (한국 시간, UTC+9) - 테스트용
    # UTC 기준으로는 전날 오후 9시
    - cron: '0 21 15 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (optional, defaults to next month)'
        required: false
        type: string
      year:
        description: 'Target year (optional, defaults to current/next year)'
        required: false
        type: string
      school_code:
        description: 'Specific school code (optional, processes all schools if empty)'
        required: false
        type: string

jobs:
  # 먼저 처리할 학교 목록을 가져오는 job
  get-schools:
    runs-on: ubuntu-latest
    outputs:
      school_codes: ${{ steps.get-schools.outputs.school_codes }}
    steps:
      - name: Get School Codes from DB
        id: get-schools
        env:
          API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NETLIFY_URL: "${{ secrets.NETLIFY_URL || 'https://lunbat.com' }}"
          SPECIFIC_SCHOOL: ${{ github.event.inputs.school_code || '' }}
        run: |
          if [ -n "${SPECIFIC_SCHOOL}" ]; then
            # 특정 학교만 처리
            echo "Processing specific school: ${SPECIFIC_SCHOOL}"
            school_codes='["'${SPECIFIC_SCHOOL}'"]'
          else
            # DB에서 실제 학교 목록 가져오기 (모든 학교 포함)
            response=$(curl -s "${NETLIFY_URL}/.netlify/functions/schedule-champion-criteria?api_key=${API_KEY}&get_schools=true")
            echo "API Response: $response"
            
            # 응답에서 학교 코드 배열 추출
            school_codes=$(echo "$response" | grep -o '"school_codes":\[[^]]*\]' | sed 's/"school_codes"://')
            
            if [ -z "$school_codes" ] || [ "$school_codes" = "[]" ]; then
              echo "No school codes found, using fallback"
              school_codes='["7361073"]'  # 최소 1개 학교 fallback
            fi
          fi
          
          echo "school_codes=${school_codes}" >> $GITHUB_OUTPUT
          echo "Found school codes: ${school_codes}"

  # 각 학교별로 병렬 처리 (1차 시도)
  process-schools:
    needs: get-schools
    runs-on: ubuntu-latest
    continue-on-error: true  # 실패해도 다음 job 실행
    strategy:
      matrix:
        school_code: ${{ fromJson(needs.get-schools.outputs.school_codes) }}
      fail-fast: false  # 하나 실패해도 다른 학교는 계속 처리
      max-parallel: 5   # 최대 5개 학교 동시 처리
    
    steps:
      - name: Process School ${{ matrix.school_code }}
        id: process-school
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NETLIFY_URL: "${{ secrets.NETLIFY_URL || 'https://lunbat.com' }}"
          MONTH: ${{ github.event.inputs.month || '' }}
          YEAR: ${{ github.event.inputs.year || '' }}
        run: |
          # URL 파라미터 구성 (month, year가 있으면 추가)
          params="api_key=${API_KEY}&school_code=${{ matrix.school_code }}"
          if [ -n "${MONTH}" ]; then
            params="${params}&month=${MONTH}"
          fi
          if [ -n "${YEAR}" ]; then
            params="${params}&year=${YEAR}"
          fi
          
          echo "🚀 Processing school ${{ matrix.school_code }} (1차 시도)"
          echo "📡 API URL: ${NETLIFY_URL}/.netlify/functions/schedule-champion-criteria?${params}"
          
          response=$(curl -s -w "%{http_code}" "${NETLIFY_URL}/.netlify/functions/schedule-champion-criteria?${params}")
          http_code="${response: -3}"
          response_body="${response%???}"
          
          echo "📊 HTTP Code: $http_code"
          echo "📝 Response: $response_body"
          
          if [ "$http_code" = "200" ]; then
            echo "✅ School ${{ matrix.school_code }} processing successful"
            exit 0
          else
            echo "❌ School ${{ matrix.school_code }} processing failed (HTTP: $http_code)"
            echo "🔍 Error details: $response_body"
            exit 1
          fi
          
      - name: Wait between schools
        run: sleep 15  # 학교간 15초 대기로 NEIS API 부하 분산 (천천히)

  # 실패한 학교들 재시도 (2차 시도)
  retry-failed-schools:
    needs: [get-schools, process-schools]
    runs-on: ubuntu-latest
    if: always()  # 이전 job이 실패해도 실행
    strategy:
      matrix:
        school_code: ${{ fromJson(needs.get-schools.outputs.school_codes) }}
      fail-fast: false
      max-parallel: 3   # 재시도는 더 천천히 (3개씩)
    
    steps:
      - name: Check if school needs retry
        id: check-retry
        env:
          API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NETLIFY_URL: "${{ secrets.NETLIFY_URL || 'https://lunbat.com' }}"
          MONTH: ${{ github.event.inputs.month || '' }}
          YEAR: ${{ github.event.inputs.year || '' }}
        run: |
          # 현재 월/년도 계산
          if [ -n "${MONTH}" ] && [ -n "${YEAR}" ]; then
            target_month="${MONTH}"
            target_year="${YEAR}"
          else
            # 익월 계산
            current_date=$(date)
            target_month=$(date -d "next month" +%m | sed 's/^0//')
            target_year=$(date -d "next month" +%Y)
          fi
          
          echo "Checking if school ${{ matrix.school_code }} needs retry for ${target_year}-${target_month}"
          
          # champion_criteria 테이블에서 해당 학교/월 데이터 존재 확인
          # 이 부분은 실제로는 API 호출로 확인해야 하지만, 간단히 재시도 진행
          echo "needs_retry=true" >> $GITHUB_OUTPUT
          
      - name: Retry School ${{ matrix.school_code }}
        if: steps.check-retry.outputs.needs_retry == 'true'
        env:
          API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NETLIFY_URL: "${{ secrets.NETLIFY_URL || 'https://lunbat.com' }}"
          MONTH: ${{ github.event.inputs.month || '' }}
          YEAR: ${{ github.event.inputs.year || '' }}
        run: |
          # URL 파라미터 구성
          params="api_key=${API_KEY}&school_code=${{ matrix.school_code }}"
          if [ -n "${MONTH}" ]; then
            params="${params}&month=${MONTH}"
          fi
          if [ -n "${YEAR}" ]; then
            params="${params}&year=${YEAR}"
          fi
          
          echo "🔄 Retrying school ${{ matrix.school_code }} (2차 시도)"
          echo "📡 Retry API URL: ${NETLIFY_URL}/.netlify/functions/schedule-champion-criteria?${params}"
          
          response=$(curl -s -w "%{http_code}" "${NETLIFY_URL}/.netlify/functions/schedule-champion-criteria?${params}")
          http_code="${response: -3}"
          response_body="${response%???}"
          
          echo "📊 Retry HTTP Code: $http_code"
          echo "📝 Retry Response: $response_body"
          
          if [ "$http_code" = "200" ]; then
            echo "✅ School ${{ matrix.school_code }} retry successful"
          else
            echo "❌ School ${{ matrix.school_code }} retry failed (HTTP: $http_code)"
            echo "🔍 Retry error details: $response_body"
          fi
          
      - name: Wait between retries
        if: steps.check-retry.outputs.needs_retry == 'true'
        run: sleep 20  # 재시도는 더 긴 대기시간 (20초)
